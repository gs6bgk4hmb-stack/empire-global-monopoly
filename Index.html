<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empire: Global Monopoly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --sky-top: #4FB6F0;
    --sky-bottom: #BFEBFF;
    --dirt-1: #C9986B;
    --dirt-2: #A97A4E;
    --dirt-edge: #8C6239;
    --gold: #FFD166;
    --gold-dark: #E3A62F;
    --pink: #FF6FA0;
    --pink-dark: #E24E82;
    --orange: #FF9142;
    --orange-dark: #E5731F;
    --teal: #2EC4B6;
    --teal-dark: #1F9C90;
    --ink: #22283B;
    --ink-soft: #4A5170;
    --panel: #FFF8ED;
    --panel-edge: #22283B;
    --cream: #FFF3DD;
    --danger: #FF5D5D;
    --green: #3FB871;
    font-size: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #2A2438;
      --ink: #F4EFE3;
      --ink-soft: #D8D0E8;
      --cream: #3A3350;
      --panel-edge: #111018;
    }
  }
  :root[data-theme="dark"] {
    --panel: #2A2438;
    --ink: #F4EFE3;
    --ink-soft: #D8D0E8;
    --cream: #3A3350;
    --panel-edge: #111018;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background: var(--sky-bottom);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
    position: relative;
  }
  .num { font-family: 'Baloo 2', sans-serif; }

  /* ---------- REDUCED ANIMATION MODES ---------- */
  body.anim-off .coin-pulse,
  body.anim-off .coin-btn.kick,
  body.anim-off .balance-amount.flash,
  body.anim-off .plot.filled svg,
  body.anim-off .land-grid.bump,
  body.anim-off .floatup,
  body.anim-off .spark,
  body.anim-off .pixel-cat,
  body.anim-off .pixel-cat svg { animation: none !important; transition: none !important; }
  body.ambient-off .cloud,
  body.ambient-off .bird,
  body.ambient-off .win,
  body.ambient-off .stars circle { animation: none !important; }

  /* ---------- TOP BANK CARD ---------- */
  .statbar { position: relative; z-index: 1; padding: 10px 14px 0; background: transparent; }
  .card-widget {
    position: relative;
    border-radius: 18px;
    padding: 14px 16px 12px;
    color: #fff;
    background: var(--card-a, linear-gradient(135deg,#4FCF8C,#1F9C4A));
    border: 2px solid rgba(255,255,255,.35);
    box-shadow: 0 8px 18px -6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    overflow: hidden;
  }
  .card-widget::after {
    content: "";
    position: absolute;
    top: -40%; right: -25%;
    width: 70%; height: 180%;
    background: rgba(255,255,255,.12);
    transform: rotate(20deg);
    pointer-events: none;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-chip {
    width: 30px; height: 22px; border-radius: 5px;
    background: linear-gradient(135deg,#FFE9A8,#E3A62F);
    border: 1px solid rgba(0,0,0,.25);
    position: relative;
  }
  .card-chip::before, .card-chip::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; background: rgba(0,0,0,.25); }
  .card-chip::before { top: 50%; }
  .card-chip::after { top: 33%; }
  .card-skin-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.7);
    background: rgba(0,0,0,.18);
    color: #fff; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .balance { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .coin-ico { width: 28px; height: 28px; flex-shrink: 0; }
  .balance-amount { font-size: 1.55rem; font-weight: 800; letter-spacing: .3px; }
  .mini-stats { display: flex; gap: 12px; font-size: .76rem; font-weight: 700; color: rgba(255,255,255,.85); margin-top: 6px; flex-wrap: wrap; }
  .mini-stats span { white-space: nowrap; }
  .card-label { margin-top: 10px; font-size: .62rem; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.65); }
  .retro-money { font-family: 'Special Elite', 'Nunito', monospace !important; color: #F1E4BE !important; letter-spacing: .5px; }
  .pixel-cat {
    position: absolute; bottom: 8px; left: -30px; z-index: 2;
    animation: catwalk 14s linear infinite;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.3));
  }
  .pixel-cat svg { animation: catbob .3s steps(2) infinite; display: block; }
  @keyframes catwalk { 0% { left: -30px; } 100% { left: 100%; } }
  @keyframes catbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }

  /* ---------- NIGHT MODE ---------- */
  body.night-mode { --sky-top: #1B2340; --sky-bottom: #3B3766; }
  .stars { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  body.night-mode .stars { opacity: 1; }
  body.night-mode .stars circle { animation: twinkle 3s ease-in-out infinite; }

  /* ---------- SCENE ---------- */
  .scene { position: relative; flex: 1; min-height: 0; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 62%); overflow: hidden; }
  .cloud { position: absolute; opacity: .9; filter: drop-shadow(0 4px 0 rgba(0,0,0,.03)); animation: drift 60s linear infinite; }
  @keyframes drift { from { transform: translateX(-10vw); } to { transform: translateX(110vw); } }
  .bird { position: absolute; width: 22px; height: 12px; opacity: .6; animation: birdfly linear infinite; }
  @keyframes birdfly { from { transform: translateX(-8vw) translateY(0); } to { transform: translateX(112vw) translateY(-16px); } }
  .bird svg { animation: flap .5s ease-in-out infinite alternate; display:block; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.55); } }
  .hills { position: absolute; left: 0; right: 0; bottom: 22%; height: 26%; z-index: 1; }
  .garland { position: absolute; top: 6px; left: 0; width: 100%; height: 50px; pointer-events: none; z-index: 3; }
  .skyline-panel { background: linear-gradient(180deg, var(--sky-bottom) 0%, #DCF2E4 100%); padding: 10px 0 0; }
  .skyline-panel svg { display: block; width: 100%; height: 120px; }
  .skyline-panel .win { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .95; } 50% { opacity: .4; } }
  .skyline-caption { text-align: center; font-size: .68rem; font-weight: 700; color: var(--ink-soft); padding-bottom: 8px; }

  .scroll-area { position: absolute; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; padding-bottom: 110px; -webkit-overflow-scrolling: touch; }

  .clicker-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
  .float-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .floatup {
    position: absolute; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.15rem;
    color: #1F9C4A; text-shadow: 0 1px 0 #fff, 0 2px 3px rgba(0,0,0,.15);
    animation: floatup .85s ease-out forwards;
  }
  @keyframes floatup {
    0% { transform: translate(-50%,-50%) translateY(0) scale(.7); opacity: 0; }
    15% { opacity: 1; transform: translate(-50%,-50%) translateY(-6px) scale(1.1); }
    100% { transform: translate(-50%,-50%) translateY(-70px) scale(1); opacity: 0; }
  }

  .coin-btn {
    position: relative; width: 168px; height: 168px; border: none; background: none; padding: 0; cursor: pointer;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.22));
    transition: transform .06s ease;
  }
  .coin-btn:active { transform: scale(.92); }
  .coin-btn svg { width: 100%; height: 100%; display: block; }
  .coin-pulse { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  .coin-btn.kick { animation: kick .38s ease-out; }
  @keyframes kick {
    0% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(.86) rotate(-6deg); }
    60% { transform: scale(1.12) rotate(4deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .balance-amount.flash { animation: flashgold .35s ease-out; }
  @keyframes flashgold {
    0% { color: #fff; text-shadow: 0 0 0 rgba(255,209,102,0); }
    40% { color: var(--gold); text-shadow: 0 0 10px rgba(255,209,102,.9); }
    100% { color: #fff; text-shadow: 0 0 0 rgba(255,209,102,0); }
  }

  .click-caption {
    margin-top: 10px; font-weight: 800; color: #fff; background: rgba(34,40,59,.55);
    padding: 4px 14px; border-radius: 999px; font-size: .82rem;
  }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

  /* ---------- LAND ---------- */
  .land-title {
    text-align: center; color: var(--ink); background: var(--cream); display: inline-block;
    margin: 0 auto 12px; padding: 5px 16px; border-radius: 999px; font-weight: 800; font-size: .8rem;
    border: 2px solid var(--panel-edge); box-shadow: 0 2px 0 rgba(0,0,0,.12);
  }
  .land-title-row { text-align: center; }
  .ground-panel {
    margin-top: 22px; padding: 18px 0 26px;
    background: radial-gradient(circle at 15% 20%, rgba(255,255,255,.25), transparent 40%), linear-gradient(180deg, #9BD17A 0%, #7EC162 100%);
    border-top: 4px solid #5FA84A;
    box-shadow: inset 0 8px 14px -8px rgba(0,0,0,.2);
  }
  .land-grid {
    display: flex; gap: 10px; padding: 0 16px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .land-grid::-webkit-scrollbar { display: none; }
  .land-grid.bump { animation: bump .4s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .plot {
    flex: 0 0 auto; width: 100px; aspect-ratio: 1 / 0.82; border-radius: 14px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), transparent 60%), linear-gradient(160deg, var(--dirt-1), var(--dirt-2));
    border: 3px dashed var(--dirt-edge); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;
    scroll-snap-align: start;
  }
  .plot.filled {
    border-style: solid; border-color: var(--panel-edge);
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 55%), linear-gradient(160deg, #BFE79B, #9BD17A);
  }
  .plot.addbtn { background: rgba(255,255,255,.28); border-style: dashed; border-color: rgba(34,40,59,.4); cursor: pointer; }
  .plot.addbtn .plus { font-family: 'Baloo 2', sans-serif; font-size: 2.2rem; font-weight: 800; color: rgba(34,40,59,.45); line-height: 1; }
  .plot.addbtn:active { transform: scale(.95); }
  .plot.addbtn .plot-label { color: var(--ink); text-shadow: none; font-size: .58rem; }
  .plot svg { width: 78%; height: 78%; }
  .plot.filled svg { animation: popIn .5s cubic-bezier(.3,1.6,.4,1) both; }
  @keyframes popIn {
    0% { transform: scale(0) translateY(20px); opacity: 0; }
    70% { transform: scale(1.12) translateY(-4px); opacity: 1; }
    100% { transform: scale(1) translateY(0); }
  }
  .plot-label {
    position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
    font-size: .55rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .plot-badge {
    position: absolute; top: 4px; right: 4px; background: rgba(34,40,59,.65); color: #fff;
    font-size: .55rem; font-weight: 800; padding: 1px 5px; border-radius: 999px;
  }

  /* ---------- TABBAR + TOP ICONS ---------- */
  .tabbar { position: relative; z-index: 40; display: flex; background: var(--panel); border-top: 3px solid var(--panel-edge); padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 6px; flex-shrink: 0; }
  .tab-btn {
    flex: 1; min-width: 0; border: 2px solid var(--panel-edge); background: var(--cream); color: var(--ink);
    border-radius: 13px; padding: 7px 3px 6px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .62rem;
    line-height: 1.15; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  }
  .tab-btn.active { background: var(--gold); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .tab-ico { font-size: 1.1rem; line-height: 1; }

  .top-icons {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 45;
    display: flex; flex-direction: column; gap: 8px;
  }
  .top-icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--panel-edge);
    background: var(--panel); color: var(--ink); font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
  }
  .top-icon-btn:active { transform: scale(.93); }

  .beta-tag {
    position: fixed; left: 10px; bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    font-size: .62rem; font-weight: 800; color: rgba(255,255,255,.55);
    background: rgba(34,40,59,.35); padding: 2px 8px; border-radius: 999px;
    z-index: 46; cursor: pointer; letter-spacing: .5px;
  }

  /* ---------- SHEET ---------- */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(20,20,30,.45); z-index: 49; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--panel);
    border-top: 3px solid var(--panel-edge); border-radius: 22px 22px 0 0; max-height: 78vh;
    transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.3,1);
    padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 24px rgba(0,0,0,.25);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
  .sheet-head h2 { margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 1.1rem; color: var(--ink); }
  .sheet-close {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel-edge); background: var(--cream);
    color: var(--ink); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .sheet-body { padding: 4px 14px 18px; overflow-y: auto; max-height: calc(78vh - 54px); }
  .sheet-section-title {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: .82rem; color: var(--ink-soft);
    margin: 14px 4px 8px; text-transform: uppercase; letter-spacing: .5px;
  }
  .sheet-section-title:first-child { margin-top: 2px; }
  .sheet-back {
    display: inline-flex; align-items: center; gap: 6px; background: var(--cream); border: 2px solid var(--panel-edge);
    border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .76rem; color: var(--ink); margin-bottom: 10px; cursor: pointer;
  }
  .cooldown-note {
    text-align: center; font-size: .76rem; font-weight: 800; padding: 6px 10px; border-radius: 12px; margin-bottom: 10px;
  }
  .cooldown-note.ready { color: #1F9C4A; background: rgba(63,184,113,.15); }
  .cooldown-note.waiting { color: #E0453F; background: rgba(255,93,93,.12); }

  .card {
    display: flex; align-items: center; gap: 12px; background: var(--cream); border: 2px solid var(--panel-edge);
    border-radius: 16px; padding: 10px 12px; margin-bottom: 10px;
  }
  .card-ico {
    width: 50px; height: 50px; flex-shrink: 0; border-radius: 12px; background: rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 1.5rem;
  }
  .card-ico svg { width: 100%; height: 100%; }
  .card-info { flex: 1; min-width: 0; }
  .card-info h3 { margin: 0 0 2px; font-size: .87rem; font-family: 'Baloo 2', sans-serif; color: var(--ink); }
  .card-info p { margin: 0; font-size: .72rem; color: var(--ink-soft); font-weight: 700; }
  .card-btn {
    flex-shrink: 0; border: none; border-radius: 12px; padding: 9px 12px; font-family: 'Baloo 2', sans-serif;
    font-weight: 700; font-size: .8rem; color: #fff; background: linear-gradient(180deg, var(--green), #2E9A5C);
    box-shadow: 0 3px 0 #227C46; cursor: pointer; min-width: 74px;
  }
  .card-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #227C46; }
  .card-btn:disabled { background: #9AA0B4; box-shadow: 0 3px 0 #767B8C; cursor: default; }
  .card-btn.owned { background: linear-gradient(180deg, #FFD166, #E3A62F); box-shadow: 0 3px 0 #B27F1B; color: var(--ink); }
  .card-btn.danger-btn { background: linear-gradient(180deg, #FF7A7A, #E0453F); box-shadow: 0 3px 0 #B22E2A; }
  .card.locked { opacity: .68; }
  .card.locked .card-ico { filter: grayscale(.3); }
  .card.achieved { background: linear-gradient(135deg, #FFE9A8, #FFD166); border-color: var(--gold-dark); }
  .card.player-row { background: linear-gradient(135deg, #FFE9A8, #FFD166) !important; border-color: var(--gold-dark) !important; }

  .empty-note { text-align: center; padding: 10px 12px 16px; color: var(--ink-soft); font-weight: 700; font-size: .82rem; line-height: 1.5; }

  .rank-badge {
    width: 28px; height: 28px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: .82rem; color: var(--ink); flex-shrink: 0;
  }
  .used-codes-note { padding: 0 4px; font-size: .74rem; color: var(--ink-soft); font-weight: 700; }

  .field-row { display: flex; gap: 8px; padding: 4px 4px 14px; }
  .field-row input {
    flex: 1; min-width: 0; border: 2px solid var(--panel-edge); border-radius: 12px; padding: 10px 12px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .88rem; background: var(--panel); color: var(--ink);
  }
  .field-row input::placeholder { color: var(--ink-soft); opacity: .7; }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--cream); border: 2px solid var(--panel-edge); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px;
  }
  .settings-row .settings-label { font-family: 'Baloo 2', sans-serif; font-size: .84rem; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .settings-row p.settings-desc { margin: 2px 0 0; font-size: .68rem; color: var(--ink-soft); font-weight: 700; }
  .toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .toggle .track {
    position: absolute; inset: 0; background: #9AA0B4; border-radius: 999px; transition: background .2s ease; border: 2px solid var(--panel-edge);
  }
  .toggle .knob {
    position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; background: #fff; border-radius: 50%;
    transition: transform .2s ease; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .toggle input:checked + .track { background: var(--green); }
  .toggle input:checked + .track .knob { transform: translateX(20px); }

  .settings-block { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .settings-block h3 { margin: 0; font-family: 'Baloo 2', sans-serif; font-size: .95rem; color: var(--ink); }
  .settings-block p { margin: 0; font-size: .78rem; color: var(--ink-soft); font-weight: 700; }
  .hidden-admin-hint { text-align: center; font-size: .68rem; color: var(--ink-soft); opacity: .5; padding: 6px 0 0; font-weight: 700; }

  /* ---------- OFFLINE MODAL ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,20,30,.55); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 20px; padding: 22px 20px; text-align: center; max-width: 320px; box-shadow: 0 10px 0 rgba(0,0,0,.15); }
  .modal .big-ico { font-size: 2.4rem; }
  .modal h2 { font-family: 'Baloo 2', sans-serif; margin: 6px 0 4px; font-size: 1.1rem; color: var(--ink); }
  .modal p { margin: 0 0 16px; font-size: .85rem; color: var(--ink-soft); font-weight: 700; }
  .modal button {
    border: none; background: linear-gradient(180deg, var(--gold), var(--gold-dark)); color: var(--ink);
    font-family: 'Baloo 2', sans-serif; font-weight: 700; padding: 10px 26px; border-radius: 14px;
    box-shadow: 0 4px 0 #B27F1B; cursor: pointer; font-size: .95rem;
  }
  .modal button:active { transform: translateY(3px); box-shadow: 0 1px 0 #B27F1B; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: .8rem;
    z-index: 70; opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; white-space: nowrap; max-width: 90vw; text-overflow: ellipsis; overflow: hidden;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- ASSISTANT OVERLAY ---------- */
  .assistant-overlay {
    position: fixed; inset: 0; z-index: 200; background: linear-gradient(160deg, #4FB6F0, #7FD8C8 55%, #BFEBFF);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px;
    text-align: center; overflow-y: auto;
  }
  .assistant-overlay h1 {
    font-family: 'Baloo 2', sans-serif; color: #fff; font-size: 1.5rem; margin: 0 0 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .assistant-overlay .sub { color: rgba(255,255,255,.9); font-weight: 700; font-size: .88rem; margin-bottom: 18px; }

  .assistant-preview { position: relative; width: 200px; height: 360px; margin: 0 auto 6px; }
  .assistant-preview img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.28));
    opacity: 0; transform: scale(.96) translateY(6px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .assistant-preview img.show { opacity: 1; transform: scale(1) translateY(0); }
  .assistant-preview-name { font-family: 'Baloo 2', sans-serif; font-size: 1.25rem; color: #fff; margin: 4px 0 2px; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .assistant-preview-tag { color: rgba(255,255,255,.92); font-weight: 700; font-size: .82rem; margin-bottom: 18px; }

  .assistant-switcher { display: flex; gap: 14px; justify-content: center; margin-bottom: 20px; }
  .assistant-switch-btn {
    width: 62px; border: 3px solid rgba(255,255,255,.45); border-radius: 16px; padding: 4px;
    background: rgba(255,255,255,.14); cursor: pointer;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .assistant-switch-btn img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: center 10%; border-radius: 11px; display: block; background: #9aa3ad; }
  .assistant-switch-btn span { display: block; color: #fff; font-weight: 800; font-size: .66rem; margin-top: 3px; }
  .assistant-switch-btn.active { border-color: #fff; background: rgba(255,255,255,.38); transform: scale(1.08); }
  .assistant-switch-btn:active { transform: scale(.96); }

  .assistant-confirm-btn {
    width: 100%; max-width: 280px; margin: 0 auto; border: none; border-radius: 16px; padding: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1rem; color: #fff;
    background: linear-gradient(180deg, var(--green), #2E9A5C); box-shadow: 0 5px 0 #227C46; cursor: pointer;
  }
  .assistant-confirm-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #227C46; }

  .assistant-intro {
    position: fixed; inset: 0; z-index: 201; background: linear-gradient(160deg, #4FB6F0, #7FD8C8 55%, #BFEBFF);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px;
    text-align: center; cursor: pointer;
  }
  .intro-skip {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
    background: rgba(255,255,255,.32); border: 2px solid rgba(255,255,255,.65); color: #fff;
    font-weight: 800; font-size: .72rem; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .intro-stage { width: 100%; max-width: 380px; }
  .intro-img-wrap { width: 230px; height: 190px; margin: 0 auto 16px; position: relative; }
  .intro-img-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .45s ease, transform .45s ease; transform: scale(.96);
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.2));
  }
  .intro-img-wrap img.show { opacity: 1; transform: scale(1); }
  .intro-bubble {
    background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 20px; padding: 16px 18px;
    min-height: 84px; box-shadow: 0 8px 0 rgba(0,0,0,.15); opacity: 0; transform: translateY(10px);
    transition: opacity .3s ease, transform .3s ease; display: flex; align-items: center;
  }
  .intro-bubble.show { opacity: 1; transform: translateY(0); }
  .intro-bubble p { margin: 0; font-size: .94rem; line-height: 1.55; color: var(--ink); font-weight: 700; text-align: left; }
  .intro-cursor { display: inline-block; width: 2px; height: 1em; background: var(--ink); margin-left: 2px; vertical-align: -2px; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .intro-dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
  .intro-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); transition: background .2s ease, transform .2s ease; }
  .intro-dots span.active { background: #fff; transform: scale(1.3); }
  .intro-tap-hint { margin-top: 14px; font-size: .7rem; color: rgba(255,255,255,.85); font-weight: 700; }
</style>
</head>

  function cloudSet(key, value){
    return new Promise(function(resolve){
      if (tg && tg.CloudStorage) { tg.CloudStorage.setItem(key, value, function(){ resolve(); }); }
      else { try { localStorage.setItem(key, value); } catch(e){} resolve(); }
    });
  }
  function cloudGet(key){
    return new Promise(function(resolve){
      if (tg && tg.CloudStorage) { tg.CloudStorage.getItem(key, function(err, value){ resolve(err ? null : value); }); }
      else { var v = null; try { v = localStorage.getItem(key); } catch(e){} resolve(v); }
    });

      else if (v) boost += u.boost;
    });
    return boost;

    if (Math.abs(to - from) < 1) { displayedMoney = to; balanceEl.textContent = fmt(to); return; }
    var start = performance.now(), dur = state.settings.animations ? 260 : 0;
    cancelAnimationFrame(tweenRAF);
    function step(now){
      var t = dur ? Math.min(1, (now - start) / dur) : 1;
      var ease = 1 - Math.pow(1 - t, 3);
      displayedMoney = from + (to - from) * ease;
      balanceEl.textContent = fmt(displayedMoney);
      if (t < 1) { tweenRAF = requestAnimationFrame(step); }
      else { displayedMoney = to; balanceEl.textContent = fmt(to); }
    }
    tweenRAF = requestAnimationFrame(step);
    if (state.settings.animations) {
      balanceEl.classList.remove('flash'); void balanceEl.offsetWidth; balanceEl.classList.add('flash');
    }
  }

    var combined = TOP30.map(function(p){ return { name: p.name, source: p.source, netWorth: p.netWorth, isPlayer: false }; });
    var insertIdx = rank - 1;
    combined.splice(insertIdx, 0, { name: 'Вы' + (state.title ? ' \u00B7 ' + state.title : ''), source: 'Твоя империя', netWorth: money, isPlayer: true });
    var above = insertIdx > 0 ? combined[insertIdx - 1] : null;
    var gapAbove = above ? (above.netWorth - money) : 0;

    html += '<div class="sheet-section-title">Твоё место в Forbes</div>';
    html += '<div class="card player-row" style="padding:10px 12px;">' +
      '<div class="rank-badge" style="background:rgba(255,255,255,.55); width:34px; height:34px; font-size:.95rem;">#' + rank + '</div>' +
      '<div class="card-info"><h3 style="font-size:.9rem;">' + (rank === 1 ? '🏆 Вы \u2014 №1 в мире!' : 'Вы на ' + rank + '-м месте') + '</h3>' +
        '<p>Состояние: ' + formatNetWorth(money) + (above ? (' \u00B7 До ' + above.name + ': ' + formatNetWorth(gapAbove)) : '') + '</p></div>' +
      '</div>';

    html += '<div class="sheet-section-title">Рейтинг Forbes (игровой)</div>';
    html += '<div class="empty-note" style="padding-top:0;">Обгоняй участников списка своим состоянием — рейтинг обновляется автоматически 😉</div>';
    combined.forEach(function(p, i){
      html += '<div class="card' + (p.isPlayer ? ' player-row' : '') + '" style="padding:8px 10px;">' +
        '<div class="rank-badge"' + (p.isPlayer ? ' style="background:rgba(255,255,255,.55);"' : '') + '>' + (i + 1) + '</div>' +
        '<div class="card-info"><h3 style="font-size:.84rem;">' + p.name + '</h3><p>' + p.source + '</p></div>' +
        '<div class="num" style="font-weight:800;color:var(--ink);font-size:.82rem;white-space:nowrap;">' + formatNetWorth(p.netWorth) + '</div>' +
        '</div>';
    });
    sheetBody.innerHTML = html;
  }

  function renderCardSheet(){
    sheetTitle.textContent = 'Стиль карты';
    var html = '';
    CARD_SKINS.forEach(function(skin){
      var unlocked = state.unlockedSkins.indexOf(skin.id) !== -1;
      var selected = state.cardSkin === skin.id;
      var btnLabel = selected ? 'Выбрана' : (unlocked ? 'Выбрать' : (skin.future ? 'Скоро' : ('Купить $' + skin.price.toLocaleString('ru-RU'))));
      var disabled = selected || (!unlocked && skin.future) || (!unlocked && !skin.future && state.money < skin.price);
      html += '<div class="card">' +
        '<div class="card-ico" style="background:' + skin.css + '; border:2px solid #22283B;"></div>' +
        '<div class="card-info"><h3>' + skin.name + '</h3><p>' + (unlocked ? 'Доступна для выбора' : (skin.future ? 'Появится в следующем обновлении' : ('Цена ' + fmt(skin.price)))) + '</p></div>' +
        '<button class="card-btn' + (selected ? ' owned' : '') + '" data-id="' + skin.id + '" ' + (disabled ? 'disabled' : '') + '>' + btnLabel + '</button>' +
        '</div>';
    });
    sheetBody.innerHTML = html;
    sheetBody.querySelectorAll('.card-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var skin = findSkin(id);
        if (!skin) return;
        var unlocked = state.unlockedSkins.indexOf(id) !== -1;
        if (!unlocked) {
          if (skin.future) { toast('🚧 Эта карта появится позже'); return; }
          if (state.money < skin.price) return;
          state.money -= skin.price;
          state.unlockedSkins.push(id);
          toast('Открыта ' + skin.name + '!');
        }
        state.cardSkin = id;
        applyCardSkin(); renderTopBar(); renderCardSheet(); save();
      });
    });
  }

  function redeemCode(raw){
    var code = (raw || '').trim().toUpperCase();
    if (!code) return;
    if (code === ADMIN_PASSWORD.toUpperCase()) {
      if (state.adminMode) { toast('Админ-панель уже активирована'); return; }
      activateAdmin();
      toast('👑 Админ-панель активирована!');
      renderAll(); renderPromoSheet(); save();
      return;
    }
    if (state.usedCodes.indexOf(code) !== -1) { toast('Этот код уже использован'); return; }
    var def = CODES[code];
    if (!def) { toast('Такого промокода нет'); return; }
    def.apply();
    state.usedCodes.push(code);
    applyCardLabel(); applyNightMode(); applyRetroMoney(); applyCat();
    toast('🎉 ' + def.reward);
    renderAll(); renderPromoSheet(); save();
  }

  function renderPromoSheet(){
    sheetTitle.textContent = 'Промокоды';
    sheetBody.innerHTML =
      '<div class="empty-note" style="padding-top:0;">Введи промокод и получи награду. Каждый код можно использовать один раз.</div>' +
      '<div class="field-row"><input id="promoInput" type="text" placeholder="Промокод" autocapitalize="characters"><button class="card-btn" id="promoSubmit">Ввести</button></div>' +
      (state.usedCodes.length ? '<div class="used-codes-note">Активировано: ' + state.usedCodes.join(', ') + '</div>' : '');
    var input = document.getElementById('promoInput');
    document.getElementById('promoSubmit').addEventListener('click', function(){ redeemCode(input.value); input.value = ''; });
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { redeemCode(input.value); input.value = ''; } });
  }

  function resetProgress(){
    state.money = 0; state.clickLevel = 0; state.branches = {};
    state.taxi = { cars: {}, nextAt: 0 };
    state.hotels = {}; state.hotelNextAt = 0;
    state.cinemas = {}; state.cinemaNextAt = 0;
    state.lifetimeEarned = 0; state.totalClicks = 0;
    state.cardSkin = 'green'; state.unlockedSkins = ['green'];
    state.usedCodes = []; state.title = null;
    state.catUnlocked = false; state.retroMoney = false; state.nightMode = false; state.adminMode = false;
    displayedMoney = 0;
    applyCardSkin(); applyNightMode(); applyRetroMoney(); applyCat(); applyCardLabel();
  }
  function activateAdmin(){
    state.adminMode = true;
    state.money = 999999999999;
    BUSINESSES.forEach(function(b){ state.branches[b.id] = MAX_BRANCHES; });
    TAXI_CLASSES.forEach(function(cls){ cls.models.forEach(function(m){ state.taxi.cars[m.id] = TAXI_CLASS_MAX / cls.models.length; }); });
    HOTEL_TIERS.forEach(function(t){
      var up = {};
      HOTEL_UPGRADES.forEach(function(u){ up[u.id] = u.repeatable ? u.maxCount : true; });
      state.hotels[t.id] = { upgrades: up };
    });
    CINEMA_TIERS.forEach(function(t){
      var up = {};
      CINEMA_UPGRADES.forEach(function(u){ up[u.id] = true; });
      state.cinemas[t.id] = { upgrades: up };
    });
  }

  function toggleRow(id, label, desc, checked){
    return '<div class="settings-row"><div><div class="settings-label">' + label + '</div><p class="settings-desc">' + desc + '</p></div>' +
      '<label class="toggle"><input type="checkbox" id="' + id + '" ' + (checked ? 'checked' : '') + '><span class="track"><span class="knob"></span></span></label></div>';
  }

  function renderSettingsSheet(){
    sheetTitle.textContent = 'Настройки';
    var html = '<div class="sheet-section-title">Игра</div>';
    html += toggleRow('setAnim', '🎬 Анимации интерфейса', 'Плавные эффекты кликов и покупок', state.settings.animations);
    html += toggleRow('setAmbient', '☁️ Фоновые анимации', 'Облака, птицы, мерцание окон', state.settings.ambientAnim);
    html += toggleRow('setHaptics', '📳 Тактильный отклик', 'Вибрация при покупках в Telegram', state.settings.haptics);
    html += toggleRow('setFloat', '🔢 Плавающие цифры', 'Показывать +$ при клике', state.settings.floatNumbers);
    html += toggleRow('setNight', '🌙 Ночной режим', 'Звёздное небо вместо дневного', state.nightMode);

    html += '<div class="sheet-section-title">Помощник</div>';
    html += '<div class="card"><div class="card-ico">🙋</div><div class="card-info"><h3>Твой помощник</h3><p>' + (state.assistant === 'boy' ? 'Арен' : state.assistant === 'girl' ? 'Лея' : 'Не выбран') + '</p></div><button class="card-btn" id="changeAssistantBtn">Сменить</button></div>';

    html += '<div class="sheet-section-title">Данные</div>';
    html += '<div class="card settings-block"><h3>Сброс прогресса</h3><p>Обнулит баланс, бизнесы, филиалы и коды. Отменить нельзя.</p>';
    if (!confirmingReset) { html += '<button class="card-btn danger-btn" id="resetBtn">Сбросить всё</button>'; }
    else { html += '<div style="display:flex; gap:8px;"><button class="card-btn danger-btn" id="resetConfirmBtn">Точно сбросить</button><button class="card-btn owned" id="resetCancelBtn">Отмена</button></div>'; }
    html += '</div>';

    sheetBody.innerHTML = html;

    document.getElementById('setAnim').addEventListener('change', function(e){ state.settings.animations = e.target.checked; applyAnimSettings(); save(); });
    document.getElementById('setAmbient').addEventListener('change', function(e){ state.settings.ambientAnim = e.target.checked; applyAnimSettings(); save(); });
    document.getElementById('setHaptics').addEventListener('change', function(e){ state.settings.haptics = e.target.checked; save(); });
    document.getElementById('setFloat').addEventListener('change', function(e){ state.settings.floatNumbers = e.target.checked; save(); });
    document.getElementById('setNight').addEventListener('change', function(e){ state.nightMode = e.target.checked; applyNightMode(); save(); });

    document.getElementById('changeAssistantBtn').addEventListener('click', function(){
      assistantReselecting = true;
      openAssistantOverlay(state.assistant || 'boy');
      closeSheet();
    });

    var resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.addEventListener('click', function(){ confirmingReset = true; renderSettingsSheet(); });
    var cancelBtn = document.getElementById('resetCancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', function(){ confirmingReset = false; renderSettingsSheet(); });
    var confirmBtn = document.getElementById('resetConfirmBtn');
    if (confirmBtn) confirmBtn.addEventListener('click', function(){
      resetProgress(); confirmingReset = false;
      toast('Прогресс сброшен');
      renderAll(); renderSettingsSheet(); save();
    });
  }

  /* ---------------- Tabs / Sheet plumbing ---------------- */
  function renderAll(){
    renderTopBar();
    renderLand();
    if (sheet.classList.contains('open')) {
      if (currentSheetTab === 'biz') renderBizSheet();
      else if (currentSheetTab === 'empire') renderEmpireSheet();
      else if (currentSheetTab === 'ach') renderAchievementsSheet();
      else if (currentSheetTab === 'stats') renderStatsSheet();
      else if (currentSheetTab === 'cards') renderCardSheet();
      else if (currentSheetTab === 'taxi') renderTaxiSheet();
      else if (currentSheetTab === 'hotel') renderHotelSheet();
      else if (currentSheetTab === 'cinema') renderCinemaSheet();
    }
  }

  function openSheet(tab){
    ALL_TABS.forEach(function(t){ t.classList.remove('active'); });
    currentSheetTab = tab;
    if (tab === 'biz') { tabBiz.classList.add('active'); renderBizSheet(); }
    if (tab === 'empire') { tabEmpire.classList.add('active'); renderEmpireSheet(); }
    if (tab === 'ach') { tabAch.classList.add('active'); renderAchievementsSheet(); }
    if (tab === 'stats') { tabStats.classList.add('active'); renderStatsSheet(); }
    if (tab === 'cards') { renderCardSheet(); }
    if (tab === 'promo') { renderPromoSheet(); }
    if (tab === 'settings') { confirmingReset = false; renderSettingsSheet(); }
    if (tab === 'taxi') { renderTaxiSheet(); }
    if (tab === 'hotel') { renderHotelSheet(); }
    if (tab === 'cinema') { renderCinemaSheet(); }
    sheet.classList.add('open');
    sheetBackdrop.classList.add('open');
  }
  function closeSheet(){ sheet.classList.remove('open'); sheetBackdrop.classList.remove('open'); }

  tabBiz.addEventListener('click', function(){ openSheet('biz'); });
  tabEmpire.addEventListener('click', function(){ openSheet('empire'); });
  tabAch.addEventListener('click', function(){ openSheet('ach'); });
  tabStats.addEventListener('click', function(){ openSheet('stats'); });
  cardSkinBtn.addEventListener('click', function(){ openSheet('cards'); });
  btnPromo.addEventListener('click', function(){ openSheet('promo'); });
  btnSettings.addEventListener('click', function(){ openSheet('settings'); });
  sheetClose.addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', closeSheet);

  /* ---------------- Assistant flow ---------------- */
  var ASSISTANT_NAMES = { boy: 'Арен', girl: 'Лея' };
  var ASSISTANT_TAGS = { boy: 'Весёлый и находчивый', girl: 'Добрая и отзывчивая' };
  var selectedAssistantPreview = 'boy';
  var previewImgs = assistantOverlay.querySelectorAll('.assistant-preview img');
  var switchBtns = assistantOverlay.querySelectorAll('.assistant-switch-btn');
  var previewNameEl = document.getElementById('assistantPreviewName');
  var previewTagEl = document.getElementById('assistantPreviewTag');
  var confirmBtnEl = document.getElementById('assistantConfirmBtn');

  function updateAssistantPreview(){
    previewImgs.forEach(function(im){ im.classList.toggle('show', im.getAttribute('data-id') === selectedAssistantPreview); });
    switchBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-assistant') === selectedAssistantPreview); });
    previewNameEl.textContent = ASSISTANT_NAMES[selectedAssistantPreview];
    previewTagEl.textContent = ASSISTANT_TAGS[selectedAssistantPreview];
    confirmBtnEl.textContent = 'Выбрать ' + (selectedAssistantPreview === 'boy' ? 'Арена' : 'Лею');
  }
  function openAssistantOverlay(preselect){
    selectedAssistantPreview = preselect || 'boy';
    updateAssistantPreview();
    assistantOverlay.style.display = 'flex';
  }
  switchBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      selectedAssistantPreview = btn.getAttribute('data-assistant');
      updateAssistantPreview();
    });
  });
  confirmBtnEl.addEventListener('click', function(){ chooseAssistant(selectedAssistantPreview); });
  updateAssistantPreview();

  function chooseAssistant(id){
    state.assistant = id;
    assistantOverlay.style.display = 'none';
    save();
    if (assistantReselecting) {
      assistantReselecting = false;
      toast(ASSISTANT_NAMES[id] + ' теперь твой помощник!');
    } else if (!assistantIntroShown) {
      assistantIntroShown = true;
      showAssistantIntro(id);
    }
  }
  function showAssistantIntro(id){
    var name = ASSISTANT_NAMES[id];
    var frames = window.__ASSISTANT_FRAMES__[id];
    var explanation = 'Тапай по монете, чтобы заработать первые доллары. Открывай бизнесы во вкладке «Бизнесы», расширяй их филиалами в «Империи» — но следи за налогами на высокий доход. Загляни в «Достижения» и «Статистику», а промокоды вводи во вкладке «Промокоды».';
    var steps = [
      { img: frames[0], text: 'Привет! Я Ваш ассистент ' + name + '. Сейчас я всё объясню!!' },
      { img: frames[1], text: explanation },
      { img: frames[2], text: 'Игра регулярно обновляется. Создано с любовью AM team.' }
    ];

    var idx = 0, typing = null;

    assistantIntroRoot.innerHTML =
      '<div class="assistant-intro">' +
        '<button class="intro-skip" id="introSkip">Пропустить</button>' +
        '<div class="intro-stage">' +
          '<div class="intro-img-wrap" id="introImgWrap"></div>' +
          '<div class="intro-bubble" id="introBubble"><p id="introText"></p></div>' +
          '<div class="intro-dots" id="introDots"></div>' +
          '<div class="intro-tap-hint">Нажми, чтобы продолжить →</div>' +
        '</div>' +
      '</div>';

    var overlay = assistantIntroRoot.querySelector('.assistant-intro');
    var imgWrap = document.getElementById('introImgWrap');
    var bubble = document.getElementById('introBubble');
    var textEl = document.getElementById('introText');
    var dotsEl = document.getElementById('introDots');

    steps.forEach(function(){ dotsEl.appendChild(document.createElement('span')); });
    steps.forEach(function(s, i){
      var im = document.createElement('img');
      im.src = s.img; im.alt = ''; im.setAttribute('data-idx', i);
      imgWrap.appendChild(im);
    });

    function updateDots(){
      dotsEl.querySelectorAll('span').forEach(function(d, i){ d.classList.toggle('active', i === idx); });
    }

    function typeStep(){
      var step = steps[idx];
      imgWrap.querySelectorAll('img').forEach(function(im){ im.classList.toggle('show', Number(im.getAttribute('data-idx')) === idx); });
      updateDots();
      bubble.classList.remove('show');
      clearInterval(typing);
      setTimeout(function(){
        textEl.textContent = '';
        bubble.classList.add('show');
        var speed = state.settings.animations ? 22 : 0;
        if (!speed) { textEl.textContent = step.text; return; }
        var chars = step.text.split(''), ci = 0;
        typing = setInterval(function(){
          textEl.textContent += chars[ci];
          ci++;
          if (ci >= chars.length) clearInterval(typing);
        }, speed);
      }, 220);
    }

    function finish(){
      overlay.style.transition = 'opacity .3s ease';
      overlay.style.opacity = '0';
      setTimeout(function(){ assistantIntroRoot.innerHTML = ''; }, 300);
    }

    function advance(){
      var step = steps[idx];
      if (textEl.textContent !== step.text) { clearInterval(typing); textEl.textContent = step.text; return; }
      if (idx < steps.length - 1) { idx++; typeStep(); } else { finish(); }
    }

    overlay.addEventListener('click', function(e){
      if (e.target && e.target.id === 'introSkip') return;
      advance();
    });
    document.getElementById('introSkip').addEventListener('click', function(e){ e.stopPropagation(); finish(); });

    typeStep();
  }

  /* ---------------- Save / Load ---------------- */
  var saveTimer = null;
  function saveThrottled(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 800); }
  function save(){ state.lastTs = Date.now(); cloudSet('empire_gm_state_v1', JSON.stringify(state)); }

  function showOfflineModal(seconds, earned){
    var root = document.getElementById('modalRoot');
    var hrs = Math.floor(seconds / 3600), mins = Math.floor((seconds % 3600) / 60);
    var timeStr = hrs > 0 ? (hrs + ' ч ' + mins + ' мин') : (mins + ' мин');
    root.innerHTML = '<div class="modal-backdrop"><div class="modal"><div class="big-ico">💼</div><h2>Пока вас не было...</h2>' +
      '<p>Империя работала ' + timeStr + ' и заработала ' + fmt(earned) + ' (после налогов)</p>' +
      '<button id="claimOffline">Забрать</button></div></div>';
    document.getElementById('claimOffline').addEventListener('click', function(){
      state.money += earned; root.innerHTML = ''; renderAll(); save();
    });
  }

  var OFFLINE_CAP_SEC = 2 * 3600;

  function load(){
    cloudGet('empire_gm_state_v1').then(function(raw){
      if (raw) {
        try {
          var loaded = JSON.parse(raw);
          state.money = loaded.money || 0;
          state.clickLevel = loaded.clickLevel || 0;
          state.branches = loaded.branches || {};
          state.taxi = loaded.taxi || { cars: {}, nextAt: 0 };
          state.hotels = loaded.hotels || {};
          state.hotelNextAt = loaded.hotelNextAt || 0;
          state.cinemas = loaded.cinemas || {};
          state.cinemaNextAt = loaded.cinemaNextAt || 0;
          state.lifetimeEarned = loaded.lifetimeEarned || 0;
          state.totalClicks = loaded.totalClicks || 0;
          state.cardSkin = loaded.cardSkin || 'green';
          state.unlockedSkins = loaded.unlockedSkins || ['green'];
          state.usedCodes = loaded.usedCodes || [];
          state.title = loaded.title || null;
          state.catUnlocked = !!loaded.catUnlocked;
          state.retroMoney = !!loaded.retroMoney;
          state.nightMode = !!loaded.nightMode;
          state.adminMode = !!loaded.adminMode;
          state.assistant = loaded.assistant || null;
          if (loaded.settings) {
            state.settings.animations = loaded.settings.animations !== false;
            state.settings.ambientAnim = loaded.settings.ambientAnim !== false;
            state.settings.haptics = loaded.settings.haptics !== false;
            state.settings.floatNumbers = loaded.settings.floatNumbers !== false;
          }
          if (state.assistant) assistantIntroShown = true;

          var last = loaded.lastTs || Date.now();
          var elapsed = Math.max(0, Math.floor((Date.now() - last) / 1000));
          var net = netIncomePerSec();
          if (elapsed > 5 && net > 0) {
            var capped = Math.min(elapsed, OFFLINE_CAP_SEC);
            var earned = capped * net;
            if (earned > 0) { renderAll(); showOfflineModal(capped, earned); }
          }
        } catch(e){}
      }
      applyCardSkin(); applyNightMode(); applyRetroMoney(); applyCat(); applyCardLabel(); applyAnimSettings();
      if (state.assistant) { assistantOverlay.style.display = 'none'; }
      else { openAssistantOverlay('boy'); }
      renderAll(); save();
    });
  }

  applyCardSkin(); applyNightMode(); applyRetroMoney(); applyCat(); applyCardLabel(); applyAnimSettings();
  renderLand();
  load();
})();

</script>
</body>
</html>
